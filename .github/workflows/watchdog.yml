# Внешний сторож боевого контура (netcup → owner.aquatoring.ru).
# Нужен, потому что если упадёт сам сервер, внутренний сторож ничего не сообщит.
# Каждые 10 минут: n8n /healthz + Admin API health (n8n + Postgres + креды).
# Сбой → сообщение в канал владельца через бота владельца (не чаще раза в час на одну проблему —
# за счёт cache-ключа по часу), восстановление → одно сообщение «снова работает».
name: watchdog

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      test_alert:
        description: "Отправить тестовое сообщение в канал владельца (проверка цепочки оповещения)"
        type: boolean
        default: false

permissions:
  contents: read
  actions: write

concurrency:
  group: watchdog
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Previous state
        id: prev
        uses: actions/cache/restore@v4
        with:
          path: state
          key: watchdog-state-${{ github.run_id }}
          restore-keys: watchdog-state-

      - name: Probe
        id: probe
        env:
          ADMIN_API_TOKEN: ${{ secrets.ADMIN_API_TOKEN }}
        run: |
          set -u
          fail=""
          code=$(curl -s -o /dev/null -w '%{http_code}' -m 20 --retry 2 --retry-delay 10 https://owner.aquatoring.ru/healthz || true)
          [ "$code" = 200 ] || fail="healthz=$code"
          if [ -z "$fail" ]; then
            body=$(curl -s -m 30 --retry 2 --retry-delay 10 -X POST https://owner.aquatoring.ru/webhook/adminapi1234/admin \
              -H 'Content-Type: application/json' -H "x-admin-token: ${ADMIN_API_TOKEN}" -d '{"action":"health"}' || true)
            echo "$body" | python3 -c 'import sys,json; d=json.load(sys.stdin); sys.exit(0 if d.get("ok") else 1)' 2>/dev/null || fail="admin_api health failed"
          fi
          mkdir -p state
          prev=$(cat state/status 2>/dev/null || echo ok)
          last=$(cat state/last_alert 2>/dev/null || echo 0)
          now=$(date +%s)
          if [ -n "$fail" ]; then echo "down" > state/status; else echo "ok" > state/status; fi
          echo "prev=$prev" >> "$GITHUB_OUTPUT"
          echo "fail=$fail" >> "$GITHUB_OUTPUT"
          send=no
          if [ -n "$fail" ] && { [ "$prev" = ok ] || [ $((now - last)) -ge 3600 ]; }; then send=down; echo "$now" > state/last_alert; fi
          if [ -z "$fail" ] && [ "$prev" = down ]; then send=up; fi
          [ -f state/last_alert ] || echo "$last" > state/last_alert
          [ "${{ inputs.test_alert }}" = true ] && send=test
          echo "send=$send" >> "$GITHUB_OUTPUT"
          echo "status: ${fail:-ok} (prev=$prev, send=$send)"

      - name: Notify owner
        if: steps.probe.outputs.send != 'no'
        env:
          BOT: ${{ secrets.TELEGRAM_OWNER_BOT_TOKEN }}
          CHAT: ${{ secrets.OWNER_CHAT_ID }}
          SEND: ${{ steps.probe.outputs.send }}
          FAIL: ${{ steps.probe.outputs.fail }}
        run: |
          if [ "$SEND" = test ]; then
            text="🧪 Тест сторожа гостевого дома: цепочка оповещения работает. Сервер сейчас: ${FAIL:-отвечает}."
          elif [ "$SEND" = down ]; then
            text="⚠️ Гостевой дом: сервер не отвечает ($FAIL). Боты и синхронизация могут не работать. Проверка каждые 10 минут."
          else
            text="✅ Гостевой дом: сервер снова отвечает."
          fi
          curl -s -m 20 "https://api.telegram.org/bot${BOT}/sendMessage" --data-urlencode "chat_id=${CHAT}" --data-urlencode "text=${text}" > /dev/null

      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state
          key: watchdog-state-${{ github.run_id }}
